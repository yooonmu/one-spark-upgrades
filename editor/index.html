<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>불씨 하나 — 강화 설계 편집기</title>
<style>
:root{color-scheme:dark;--bg:#0d0f0f;--panel:#151818;--line:#2a2e2d;--text:#ece8de;--dim:#a3a69f;--gold:#ffc74d;--ember:#ff8c2e;--chg:#3a2f12;--new:#143022;--bad:#4a1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:#0d0f0ff2;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:19px;margin:0;color:var(--gold);white-space:nowrap}
.bar a.lk{color:var(--dim);font-size:14px;text-decoration:none;padding:6px 10px;border:1px solid #333837;border-radius:99px;white-space:nowrap}.bar a.lk:hover{color:var(--gold);border-color:var(--gold)}
.bar .cnt{color:var(--dim);font-size:14px;margin-right:auto}
.bar .cnt b{color:var(--ember)}
.btn{background:#1f2423;border:1px solid #3a403f;border-radius:7px;padding:8px 13px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.main{background:var(--gold);border-color:var(--gold);color:#15130c;font-weight:700}
.btn.main:hover{color:#15130c;filter:brightness(1.08)}
.btn.sm{padding:4px 9px;min-height:32px;font-size:13px}
.btn.del:hover{border-color:#ff6b5e;color:#ff6b5e}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;max-width:1500px;margin:auto;padding:16px}
nav#side{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;font-size:14px}
nav#side h4{margin:14px 0 4px;font-size:12px;color:var(--dim);font-weight:600}
nav#side a{display:flex;gap:6px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--text);text-decoration:none;min-height:30px}
nav#side a:hover{background:#1c2020}
nav#side i{width:8px;height:8px;border-radius:50%;flex:none;background:#3a403f}
nav#side i.on{background:var(--ember)}
main section>h2{font-size:21px;margin:26px 0 4px}
main section>p.lead{margin:0 0 12px;color:var(--dim);max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#444);border-radius:8px;margin:10px 0;overflow:hidden}
.card>summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;list-style:none;font-weight:700;font-size:17px}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"▸";color:var(--dim);font-size:13px}
.card[open]>summary::before{content:"▾"}
.card>summary small{font-weight:400;font-size:13px;color:var(--dim)}
.card>summary .tag{margin-left:auto;font-size:12px;font-weight:700;background:var(--ember);color:#15130c;border-radius:4px;padding:1px 7px}
.body{padding:4px 14px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
.in{width:100%;background:#0f1212;border:1px solid #333837;border-radius:6px;padding:6px 8px;color:var(--text);min-height:34px}
textarea.in{resize:vertical;line-height:1.4}
.in:focus{outline:2px solid var(--gold);outline-offset:-1px}
.in.chg{background:var(--chg);border-color:#8a6a1e}
.in.new{background:var(--new);border-color:#2f7a52}
.in.bad{background:var(--bad);border-color:#b34a4a}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
th{font-size:12px;font-weight:600;color:var(--dim);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #202424;vertical-align:top}
td.n{width:34px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:11px}
td.ops{white-space:nowrap;width:1%}
tr.rnew td.n{color:#5fd39a;font-weight:700}
.fx{display:block;margin-top:3px;font-size:11.5px;color:#7f837c}
.chk{display:flex;align-items:center;gap:6px;min-height:34px;font-size:13px;color:var(--dim);white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tree{background:#0f1212;border:1px solid #232727;border-radius:6px;margin:0 0 12px;overflow-x:auto;padding:4px}
.tree svg{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hint{font-size:13px;color:var(--dim);margin:6px 0 0}
.err{color:#ff8a7e;font-size:13px;margin:4px 0 8px}
dialog{background:var(--panel);color:var(--text);border:1px solid #3a403f;border-radius:10px;padding:16px;width:min(920px,94vw)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 6px;color:var(--gold)}
dialog textarea{width:100%;height:52vh;font:13px/1.45 ui-monospace,Consolas,monospace}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid #555}
.legend .a::before{background:var(--chg);border-color:#8a6a1e}.legend .b::before{background:var(--new);border-color:#2f7a52}.legend .c::before{background:var(--bad);border-color:#b34a4a}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}nav#side{position:static;max-height:none;display:none}.bar h1{font-size:16px}}
</style>
</head>
<body>
<header class="bar">
  <h1>불씨 하나 — 강화 설계 편집기</h1>
  <a class="lk" href="../">강화 목록</a>
  <a class="lk" href="../reference/">참고 게임</a>
  <span class="cnt" id="cnt"></span>
  <button class="btn main" id="btnOut">요청문 만들기</button>
  <button class="btn" id="btnSave">파일로 저장</button>
  <button class="btn" id="btnLoad">파일 불러오기</button>
  <button class="btn del" id="btnReset">처음 상태로</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="wrap">
  <nav id="side" aria-label="갈래 목록"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg">
  <h3>요청문</h3>
  <p class="hint">아래 내용을 통째로 복사해서 채팅에 붙여 넣으면 그대로 게임에 반영합니다. 길면 "텍스트 파일로 받기"로 받아 파일을 올려도 됩니다.</p>
  <textarea class="in" id="outText" readonly aria-label="요청문"></textarea>
  <div class="row">
    <button class="btn main" id="btnCopy">복사</button>
    <button class="btn" id="btnTxt">텍스트 파일로 받기</button>
    <button class="btn" id="btnClose">닫기</button>
    <span class="hint" id="copyMsg" role="status"></span>
  </div>
</dialog>

const KEY = 'onespark-design-' + ORIGINAL.base;
const clone = o => JSON.parse(JSON.stringify(o));

let seq = Date.now() % 100000;
const uid = p => p + (++seq);
const open = new Set();
const fmt = n => Math.round(n).toLocaleString('en-US');
const OB = id => ORIGINAL.branches.find(b => b.id === id);
const OL = id => ORIGINAL.lines.find(l => l.id === id);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
// 접힌 카드는 내용을 만들지 않고, 처음 펼칠 때 만든다.
function lazy(card, build) {
  let done = false;
  const go = () => { if (card.open && !done) { done = true; build(); } };
  card.addEventListener('toggle', go);
  go();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} counts(); }

// 입력 칸: obj[key]를 고치고, 원래 값(orig[key])과 다르면 노랗게, 새 항목이면 초록으로 칠한다.
function field(obj, key, orig, o = {}) {
  const i = o.area ? el('textarea', { class: 'in', rows: o.rows || 2, 'aria-label': o.label, placeholder: o.ph })
    : el('input', { class: 'in', type: 'text', 'aria-label': o.label, placeholder: o.ph, inputmode: o.num ? 'decimal' : null });
  i.value = obj[key] == null ? '' : obj[key];
  const paint = () => {
    i.classList.remove('chg', 'new');
    if (!orig) i.classList.add('new');
    else if (String(orig[key] == null ? '' : orig[key]) !== String(obj[key] == null ? '' : obj[key])) i.classList.add('chg');
  };
  i.addEventListener('input', () => {
    let v = i.value;
    if (o.num) {
      const t = v.replace(/,/g, '').trim();
      v = t === '' ? null : Number(t);
      if (v !== null && !Number.isFinite(v)) { i.classList.add('bad'); return; }
      i.classList.remove('bad');
    }
    obj[key] = v; paint(); save(); if (o.after) o.after();
  });
  paint();
  return i;
}
const lab = (text, node) => el('label', { class: 'f' }, text, node);

// ---------- 갈래 ----------
function autoPrice(b, i) { return Math.round((Number(b.base) || 0) * Math.pow(Number(b.growth) || 1, i)); }
function parentNums(b, n) { return n.parents.map(p => b.nodes.findIndex(x => x.id === p) + 1).filter(x => x > 0); }
function depths(b) {
  const d = {}, bad = new Set();
  const go = (n, seen) => {
    if (d[n.id] != null) return d[n.id];
    if (seen.has(n.id)) { bad.add(n.id); return 0; }
    seen.add(n.id);
    let m = 0;
    for (const p of n.parents) { const pn = b.nodes.find(x => x.id === p); if (pn) m = Math.max(m, go(pn, seen) + 1); }
    seen.delete(n.id);
    return d[n.id] = m;
  };
  b.nodes.forEach(n => go(n, new Set()));
  return { d, bad };
}
function drawTree(b, box) {
  const { d, bad } = depths(b);
  const cols = [];
  b.nodes.forEach(n => { (cols[d[n.id]] = cols[d[n.id]] || []).push(n); });
  const rows = Math.max(1, ...cols.map(c => c ? c.length : 0));
  const W = 70 + cols.length * 92, H = rows * 46 + 14, pos = {};
  cols.forEach((c, x) => (c || []).forEach((n, k) => { pos[n.id] = [58 + x * 92, H / 2 + (k - (c.length - 1) / 2) * 46]; }));
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', W); s.setAttribute('height', H); s.setAttribute('role', 'img');
  s.setAttribute('aria-label', b.name + ' 갈래 구조');
  const mk = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; s.append(e); return e; };
  mk('circle', { cx: 14, cy: H / 2, r: 7, fill: '#ffc74d' });
  b.nodes.forEach(n => {
    const [x, y] = pos[n.id];
    if (!n.parents.length) mk('line', { x1: 14, y1: H / 2, x2: x, y2: y, stroke: '#4a504e', 'stroke-width': 2 });
    n.parents.forEach(p => { if (pos[p]) mk('line', { x1: pos[p][0], y1: pos[p][1], x2: x, y2: y, stroke: '#6b726f', 'stroke-width': 2 }); });
  });
  b.nodes.forEach((n, i) => {
    const [x, y] = pos[n.id];
    const g = mk('circle', { cx: x, cy: y, r: n.unlock ? 17 : 13, fill: bad.has(n.id) ? '#4a1c1c' : '#1c2020', stroke: n.unlock ? '#ffc74d' : (b.color || '#888'), 'stroke-width': n.unlock ? 3 : 2 });
    const title = document.createElementNS(NS, 'title'); title.textContent = (i + 1) + '. ' + n.name; g.append(title);
    mk('text', { x, y: y + 5, 'text-anchor': 'middle', fill: '#ece8de', 'font-size': 13, 'font-weight': 700 }, i + 1);
  });
  box.replaceChildren(s);
  return bad.size;
}
function branchCard(b) {

  const sum = el('summary', {}, b.name || '(이름 없음)', el('small', {}, b.tab + ' · 노드 ' + b.nodes.length + '개'));

  lazy(card, () => {
  const body = el('div', { class: 'body' });

  tab.addEventListener('change', () => { b.tab = tab.value; save(); render(); });
  const treeBox = el('div', { class: 'tree' });
  const errBox = el('div', { class: 'err', role: 'status' });
  const prices = [];
  const derived = () => {
    b.nodes.forEach((n, i) => { if (prices[i]) prices[i].placeholder = '자동 ' + fmt(autoPrice(b, i)); });

  };
  body.append(el('div', { class: 'grid' },
    lab('갈래 이름', field(b, 'name', ob, { label: '갈래 이름' })),
    lab('열리는 탭(구역)', tab),
    lab('첫 노드 가격(재)', field(b, 'base', ob, { num: true, label: '첫 노드 가격', after: derived })),
    lab('한 칸마다 가격 배수', field(b, 'growth', ob, { num: true, label: '가격 배수', after: derived })),
    lab('이 갈래 메모', field(b, 'memo', ob, { label: '갈래 메모', ph: '방향·의도 등 자유롭게' }))
  ), treeBox, errBox);
  const tb = el('tbody');
  b.nodes.forEach((n, i) => {
    const on = ob && ob.nodes.find(x => x.id === n.id);
    const par = el('input', { class: 'in', type: 'text', 'aria-label': (i + 1) + '번 선행 노드', placeholder: '시작점' });
    par.value = parentNums(b, n).join(', ');
    const paintPar = () => {

      par.classList.remove('bad');

      paintPar(); save(); derived();
    });
    paintPar();
    const price = field(n, 'price', on, { num: true, label: (i + 1) + '번 가격' });
    prices[i] = price;
    const chk = el('input', { type: 'checkbox', 'aria-label': (i + 1) + '번 새 기능 여부' });
    chk.checked = !!n.unlock;
    chk.addEventListener('change', () => { n.unlock = chk.checked; save(); derived(); });
    const move = dir => { const j = i + dir; if (j < 0 || j >= b.nodes.length) return; [b.nodes[i], b.nodes[j]] = [b.nodes[j], b.nodes[i]]; save(); rerender(); };
    tb.append(el('tr', { class: on ? '' : 'rnew' },
      el('td', { class: 'n' }, i + 1),
      el('td', { style: 'min-width:150px' }, field(n, 'name', on, { label: (i + 1) + '번 이름' }), n.fx ? el('span', { class: 'fx' }, '지금 내부 값: ' + n.fx) : null),
      el('td', { style: 'min-width:280px' }, field(n, 'desc', on, { area: true, label: (i + 1) + '번 효과 설명', ph: '무슨 효과인지, 수치와 함께' })),
      el('td', { style: 'width:92px' }, par),
      el('td', { style: 'width:130px' }, price),
      el('td', {}, el('label', { class: 'chk' }, chk, '새 기능')),
      el('td', { style: 'min-width:150px' }, field(n, 'memo', on, { label: (i + 1) + '번 메모', ph: '메모' })),
      el('td', { class: 'ops' },
        el('button', { class: 'btn sm', 'aria-label': (i + 1) + '번 위로', onclick: () => move(-1) }, '↑'), ' ',
        el('button', { class: 'btn sm', 'aria-label': (i + 1) + '번 아래로', onclick: () => move(1) }, '↓'), ' ',
        el('button', { class: 'btn sm del', 'aria-label': (i + 1) + '번 삭제', onclick: () => {
          b.nodes.splice(i, 1); b.nodes.forEach(x => { x.parents = x.parents.filter(p => p !== n.id); }); save(); rerender();
        } }, '삭제'))
    ));
  });
  body.append(el('div', { class: 'tw' }, el('table', {},
    el('thead', {}, el('tr', {}, ['#', '이름', '효과 설명', '선행 노드', '가격(재)', '종류', '메모', ''].map(h => el('th', {}, h)))), tb)));
  body.append(el('p', { class: 'hint' }, '선행 노드: 이 노드를 사기 전에 먼저 사야 하는 노드 번호. 비우면 가운데 시작점에서 바로 이어집니다. 둘 이상이면 쉼표로(예: 7, 8). 가격을 비우면 "첫 노드 가격 × 배수"로 자동 계산됩니다.'));
  body.append(el('div', { class: 'row' },
    el('button', { class: 'btn', onclick: () => {
      const last = b.nodes[b.nodes.length - 1];
      b.nodes.push({ id: uid('n'), name: '', desc: '', fx: '', parents: last ? [last.id] : [], unlock: false, price: null, memo: '' });
      open.add(b.id); save(); rerender();
    } }, '+ 노드 추가'),
    el('button', { class: 'btn del', onclick: () => {
      if (!confirm('"' + b.name + '" 갈래를 통째로 지울까요?')) return;
      D.branches = D.branches.filter(x => x !== b); save(); render();
    } }, '이 갈래 삭제')));
  card.append(body);
  derived();
  });
  return card;
}

// ---------- 도구 계열 ----------
const STAGE_COLS = [['name', '이름', 0, 130], ['how', '쓰는 방식', 1, 260], ['at', '열리는 시점', 0, 120], ['power', '불길 세기', 2, 70], ['hold', '붙이는 시간(초)', 2, 80], ['range', '사거리(m)', 2, 70], ['cd', '다시 쓰기(초)', 2, 80], ['rad', '반경(m)', 2, 70], ['memo', '메모', 0, 150]];
function lineCard(l) {
  const ol = OL(l.id);
  const card = el('details', { class: 'card', id: 'l-' + l.id, style: '--c:#ff8c2e', open: open.has(l.id) });
  card.addEventListener('toggle', () => { card.open ? open.add(l.id) : open.delete(l.id); });
  const changed = lineDiff(l).length;
  const sum = el('summary', {}, (l.name || '(이름 없음)') + ' 계열', el('small', {}, l.stages.map(s => s.name || '?').join(' → ')));
  if (!ol) sum.append(el('span', { class: 'tag' }, '새 계열')); else if (changed) sum.append(el('span', { class: 'tag' }, '변경 ' + changed));
  card.append(sum);
  lazy(card, () => {
  const rerender = () => { card.replaceWith(lineCard(l)); side(); };
  const body = el('div', { class: 'body' }, el('div', { class: 'grid' },
    lab('계열 이름', field(l, 'name', ol, { label: '계열 이름' })),
    lab('꺼내는 번호 키', field(l, 'key', ol, { label: '번호 키' })),
    lab('강화 갈래(아래 갈래 이름)', field(l, 'branch', ol, { label: '연결된 강화 갈래' })),
    lab('이 계열 메모', field(l, 'memo', ol, { label: '계열 메모', ph: '어떤 손맛·역할인지' }))));
  const tb = el('tbody');
  l.stages.forEach((s, i) => {
    const os = ol && ol.stages.find(x => x.id === s.id);
    tb.append(el('tr', { class: os ? '' : 'rnew' }, el('td', { class: 'n' }, (i + 1) + '단계'),
      STAGE_COLS.map(c => el('td', { style: 'min-width:' + c[3] + 'px' }, field(s, c[0], os, { area: c[2] === 1, num: c[2] === 2, label: (i + 1) + '단계 ' + c[1] }))),
      el('td', { class: 'ops' }, el('button', { class: 'btn sm del', 'aria-label': (i + 1) + '단계 삭제', onclick: () => { l.stages.splice(i, 1); save(); rerender(); } }, '삭제'))));
  });
  body.append(el('div', { class: 'tw' }, el('table', {}, el('thead', {}, el('tr', {}, ['단계', ...STAGE_COLS.map(c => c[1]), ''].map(h => el('th', {}, h)))), tb)));
  body.append(el('div', { class: 'row' },
    el('button', { class: 'btn', onclick: () => { l.stages.push({ id: uid('s'), name: '', how: '', at: '', power: null, hold: null, range: null, cd: null, rad: null, memo: '' }); open.add(l.id); save(); rerender(); } }, '+ 단계 추가'),
    el('button', { class: 'btn del', onclick: () => { if (!confirm('"' + l.name + '" 계열을 통째로 지울까요?')) return; D.lines = D.lines.filter(x => x !== l); save(); render(); } }, '이 계열 삭제')));
  card.append(body);
  });
  return card;
}

// ---------- 바뀐 내용 ----------
const q = v => v == null || v === '' ? '(비움)' : '"' + v + '"';
function cmp(out, what, a, b) { if (String(a == null ? '' : a) !== String(b == null ? '' : b)) out.push(what + ': ' + q(a) + ' → ' + q(b)); }
function lineDiff(l) {
  const ol = OL(l.id), out = [];
  if (!ol) return ['새 계열'];
  cmp(out, '계열 이름', ol.name, l.name); cmp(out, '번호 키', ol.key, l.key); cmp(out, '강화 갈래', ol.branch, l.branch); cmp(out, '메모', ol.memo, l.memo);
  ol.stages.forEach((os, i) => { if (!l.stages.find(s => s.id === os.id)) out.push('삭제: ' + (i + 1) + '단계 "' + os.name + '"'); });
  l.stages.forEach((s, i) => {
    const os = ol.stages.find(x => x.id === s.id);
    if (!os) { out.push('신규 ' + (i + 1) + '단계 "' + s.name + '": ' + (s.how || '')); return; }
    if (ol.stages.indexOf(os) !== i) out.push('"' + s.name + '" 순서: ' + (ol.stages.indexOf(os) + 1) + '단계 → ' + (i + 1) + '단계');
    STAGE_COLS.forEach(c => cmp(out, (i + 1) + '단계 ' + c[1], os[c[0]], s[c[0]]));
  });
  return out;
}
function branchDiff(b) {
  const ob = OB(b.id), out = [];
  if (!ob) return ['새 갈래'];
  cmp(out, '갈래 이름', ob.name, b.name); cmp(out, '열리는 탭', ob.tab, b.tab); cmp(out, '첫 노드 가격', ob.base, b.base); cmp(out, '가격 배수', ob.growth, b.growth); cmp(out, '메모', ob.memo, b.memo);
  ob.nodes.forEach((on, i) => { if (!b.nodes.find(n => n.id === on.id)) out.push('삭제: ' + (i + 1) + '번 "' + on.name + '"'); });
  b.nodes.forEach((n, i) => {
    const on = ob.nodes.find(x => x.id === n.id), tag = (i + 1) + '번 "' + n.name + '"';
    if (!on) { out.push('신규 ' + tag + ': ' + (n.desc || '') + ' | 선행 ' + (parentNums(b, n).join('+') || '시작점') + ' | 가격 ' + (n.price != null ? fmt(n.price) : '자동 ' + fmt(autoPrice(b, i)))); return; }
    const oi = ob.nodes.indexOf(on);
    if (oi !== i) out.push('"' + n.name + '" 순서: ' + (oi + 1) + '번 → ' + (i + 1) + '번');
    cmp(out, tag + ' 이름', on.name, n.name); cmp(out, tag + ' 설명', on.desc, n.desc);
    cmp(out, tag + ' 선행', parentNums(ob, on).join('+') || '시작점', parentNums(b, n).join('+') || '시작점');
    cmp(out, tag + ' 가격(직접 지정)', on.price, n.price); cmp(out, tag + ' 새 기능', on.unlock ? '예' : '아니오', n.unlock ? '예' : '아니오'); cmp(out, tag + ' 메모', on.memo, n.memo);
  });
  return out;
}
function allDiff() {
  const parts = [];
  const r = []; cmp(r, '전체 방향 메모', ORIGINAL.note, D.note); cmp(r, '도구 가격 규칙: 값이 안 오르는 다른 계열 노드 수', ORIGINAL.rules.toolFree, D.rules.toolFree); cmp(r, '도구 가격 규칙: 넘은 하나마다 배수', ORIGINAL.rules.toolCross, D.rules.toolCross); cmp(r, '일반 갈래 가격 배수', ORIGINAL.rules.costGrowth, D.rules.costGrowth);
  if (r.length) parts.push({ title: '규칙·전체 메모', lines: r, kind: 'rules' });
  ORIGINAL.lines.forEach(ol => { if (!D.lines.find(l => l.id === ol.id)) parts.push({ title: '도구 계열 삭제: ' + ol.name, lines: ['계열을 통째로 삭제'], kind: 'lineDel', id: ol.id }); });
  D.lines.forEach(l => { const d = lineDiff(l); if (d.length) parts.push({ title: '도구 계열: ' + l.name, lines: d, kind: 'line', obj: l }); });
  ORIGINAL.branches.forEach(ob => { if (!D.branches.find(b => b.id === ob.id)) parts.push({ title: '갈래 삭제: ' + ob.name, lines: ['갈래를 통째로 삭제'], kind: 'branchDel', id: ob.id }); });
  D.branches.forEach(b => { const d = branchDiff(b); if (d.length) parts.push({ title: '갈래: ' + b.name + ' (' + b.tab + ')', lines: d, kind: 'branch', obj: b }); });
  return parts;
}
function requestText() {
  const parts = allDiff();
  const n = parts.reduce((a, p) => a + p.lines.length, 0);
  let t = '# 불씨 하나 강화 설계 요청\n기준 빌드: ' + ORIGINAL.base + ' · 바뀐 항목 ' + n + '개\n';
  if (!parts.length) return t + '\n(바뀐 내용이 없습니다)\n';
  t += '\n## 바뀐 내용\n';
  parts.forEach(p => { t += '\n### ' + p.title + '\n' + p.lines.map(x => '- ' + x).join('\n') + '\n'; });
  const data = { base: ORIGINAL.base };
  if (parts.some(p => p.kind === 'rules')) { data.note = D.note; data.rules = D.rules; }
  data.removedLines = parts.filter(p => p.kind === 'lineDel').map(p => p.id);
  data.removedBranches = parts.filter(p => p.kind === 'branchDel').map(p => p.id);
  data.lines = parts.filter(p => p.kind === 'line').map(p => p.obj);
  data.branches = parts.filter(p => p.kind === 'branch').map(p => { const b = p.obj; return { id: b.id, name: b.name, tab: b.tab, base: b.base, growth: b.growth, memo: b.memo,
    nodes: b.nodes.map((x, i) => ({ n: i + 1, id: x.id, name: x.name, desc: x.desc, parents: parentNums(b, x), price: x.price, autoPrice: autoPrice(b, i), unlock: !!x.unlock, fx: x.fx, memo: x.memo })) }; });
  t += '\n## 데이터(바뀐 계열·갈래의 최종 모습 전체, 이대로 반영)\n```json\n' + JSON.stringify(data) + '\n```\n';
  return t;
}
function counts() {
  const parts = allDiff();
  document.getElementById('cnt').innerHTML = '기준 ' + ORIGINAL.base + ' · 바뀐 항목 <b>' + parts.reduce((a, p) => a + p.lines.length, 0) + '</b>개 · 자동 저장됨';
}

// ---------- 화면 ----------
function side() {
  const s = document.getElementById('side');
  const link = (href, name, on) => el('a', { href }, el('i', { class: on ? 'on' : '' }), name);
  s.replaceChildren(el('h4', {}, '도구 진화 단계'), D.lines.map(l => link('#l-' + l.id, l.name + ' 계열', lineDiff(l).length)),
    D.tabs.map(t => { const bs = D.branches.filter(b => b.tab === t); return bs.length ? [el('h4', {}, t), bs.map(b => link('#b-' + b.id, b.name || '(이름 없음)', branchDiff(b).length))] : null; }));
  s.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { const c = document.querySelector(a.getAttribute('href')); if (c) c.open = true; }));
}
function render() {
  const m = document.getElementById('main');
  const rules = el('section', {}, el('h2', {}, '1. 전체 방향과 규칙'),
    el('p', { class: 'lead' }, '고친 칸은 색으로 표시되고, 고친 내용은 이 브라우저에 자동 저장됩니다. 다 고친 뒤 위의 "요청문 만들기"를 눌러 나온 글을 채팅에 붙여 넣으면 됩니다.'),
    el('div', { class: 'legend' }, el('span', { class: 'a' }, '고친 칸'), el('span', { class: 'b' }, '새로 만든 칸'), el('span', { class: 'c' }, '잘못된 값')),
    el('div', { class: 'card', style: '--c:#ffc74d' }, el('div', { class: 'body', style: 'padding-top:14px' },
      lab('전체 방향 메모(표로 못 적는 요청은 여기에)', field(D, 'note', ORIGINAL, { area: true, rows: 3, label: '전체 방향 메모', ph: '예: 성냥은 초반 10분 안에 2단계까지, 조명탄은 3구역부터 살 수 있게…' })),
      el('div', { class: 'grid', style: 'margin-top:12px' },
        lab('도구 가격: 값이 안 오르는 다른 계열 노드 수', field(D.rules, 'toolFree', ORIGINAL.rules, { num: true, label: '값이 안 오르는 노드 수' })),
        lab('도구 가격: 넘은 하나마다 배수', field(D.rules, 'toolCross', ORIGINAL.rules, { num: true, label: '넘은 하나마다 배수' })),
        lab('일반 갈래 기본 가격 배수', field(D.rules, 'costGrowth', ORIGINAL.rules, { num: true, label: '일반 갈래 가격 배수' }))))));
  const tools = el('section', {}, el('h2', {}, '2. 도구 진화 단계'),
    el('p', { class: 'lead' }, '계열마다 몇 단계로 진화하는지, 각 단계가 어떤 도구이고 어떻게 쓰는지 적습니다. "열리는 시점"에는 강화 갈래의 몇 번 노드에서 바뀌는지 적어 주세요.'),
    D.lines.map(lineCard),
    el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => { const l = { id: uid('L'), name: '새 계열', key: '', branch: '', memo: '', stages: [] }; D.lines.push(l); open.add(l.id); save(); render(); } }, '+ 도구 계열 추가')));
  const br = el('section', {}, el('h2', {}, '3. 강화 갈래와 노드'),
    el('p', { class: 'lead' }, '갈래를 눌러 펼치면 가지 구조 그림과 노드 표가 나옵니다. 선행 노드 번호를 고치면 그림이 바로 바뀝니다. 금색 테두리는 새 기능(도구·장치)이 열리는 노드입니다.'),
    D.tabs.map(t => [el('h3', { style: 'margin:22px 0 2px;color:#ff8c2e' }, t), D.branches.filter(b => b.tab === t).map(branchCard),
      el('div', { class: 'row' }, el('button', { class: 'btn sm', onclick: () => {
        const b = { id: uid('b'), name: '새 갈래', color: '#9aa0a0', tab: t, base: 100, growth: D.rules.costGrowth, memo: '', nodes: [{ id: uid('n'), name: '', desc: '', fx: '', parents: [], unlock: false, price: null, memo: '' }] };
        D.branches.push(b); open.add(b.id); save(); render();
      } }, '+ ' + t + '에 갈래 추가'))]));
  m.replaceChildren(rules, tools, br);
  side(); counts();
}

// ---------- 버튼 ----------
const dlg = document.getElementById('dlg'), outText = document.getElementById('outText');
const download = (name, text, type) => { const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); };
document.getElementById('btnOut').addEventListener('click', () => { outText.value = requestText(); document.getElementById('copyMsg').textContent = ''; dlg.showModal(); });
document.getElementById('btnClose').addEventListener('click', () => dlg.close());
document.getElementById('btnCopy').addEventListener('click', async () => {
  outText.select();
  let ok = false;
  try { await navigator.clipboard.writeText(outText.value); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (e2) {} }
  document.getElementById('copyMsg').textContent = ok ? '복사했어요. 채팅에 붙여 넣으세요.' : '복사가 막혔어요. 글상자를 눌러 Ctrl+A, Ctrl+C로 복사해 주세요.';
});
document.getElementById('btnTxt').addEventListener('click', () => download('onespark-request.txt', outText.value, 'text/plain'));
document.getElementById('btnSave').addEventListener('click', () => download('onespark-design.json', JSON.stringify(D, null, 1), 'application/json'));
document.getElementById('btnLoad').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.branches || !d.lines) throw 0; D = d; save(); render(); } catch (err) { alert('이 편집기에서 저장한 파일이 아니에요.'); }
  e.target.value = '';
});
document.getElementById('btnReset').addEventListener('click', () => { if (!confirm('고친 내용을 모두 버리고 ' + ORIGINAL.base + ' 상태로 되돌릴까요?')) return; D = clone(ORIGINAL); save(); render(); });
render();
