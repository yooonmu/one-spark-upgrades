<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>불씨 하나 · 강화 나무 미리보기</title>
<style>
:root{--bg:#0f1011;--panel:#191b1d;--line:#30343a;--text:#e9e5dc;--dim:#8f918f;--ember:#e8833a;--gold:#d9b25a;--bad:#c9604e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1011;color:var(--text);font:14px/1.45 "Pretendard","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.note{background:#2a2114;border-bottom:1px solid #4a3a1e;color:#d8c9a8;padding:7px 20px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
.note button{background:#3a2e1a;border:1px solid #5a4724;color:#f0e2bf;border-radius:4px;padding:3px 9px;font:inherit;cursor:pointer}
.note button:hover{background:#4a3a20}
.wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.stage{position:relative;min-height:0;background:radial-gradient(700px 500px at 45% 50%,#251b14,#0f1011 70%)}
svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.hud{position:absolute;left:20px;top:14px;pointer-events:none}
.tabs{pointer-events:auto;display:flex;gap:4px;margin-bottom:4px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font:600 20px/1.3 inherit;font-family:inherit;letter-spacing:.04em;padding:2px 10px 4px;cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--ember)}
#shop{position:absolute;inset:0;padding:100px 28px 24px;overflow:auto}
#shop h2{margin:18px 0 8px;font-size:13px;letter-spacing:.2em;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.si{background:var(--panel);border:1px solid var(--line);border-left:3px solid #5a4a2c;border-radius:6px;padding:11px 13px;cursor:pointer}
.si:hover{border-color:#6a7078}.si.can{border-color:#7a5a2c;border-left-color:var(--gold)}
.si.own{opacity:.6;cursor:default;border-left-color:#7fae88}.si.lock{opacity:.42;cursor:default}
.si .r{display:flex;align-items:baseline;gap:8px}.si .nm{font-size:16px;font-weight:600}
.si .cost{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.si.can .cost{color:var(--gold)}.si.poor .cost{color:var(--bad)}.si.own .cost,.si.lock .cost{color:var(--dim);font-weight:400}
.si .sub{color:var(--dim);font-size:12.5px;margin-top:3px}.si .sub b{color:var(--text)}
.ash{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.ash small{font-size:13px;color:var(--dim);font-weight:400;margin-right:6px}
.legend{position:absolute;left:20px;bottom:12px;color:var(--dim);font-size:12px;display:flex;gap:16px;pointer-events:none}
.prog{position:absolute;right:20px;top:16px;width:300px;pointer-events:none}
.pt{font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:baseline}.pt b{color:var(--text);font-size:16px}.pt span{margin-left:auto;font-variant-numeric:tabular-nums}
.pb{height:5px;background:#2a2d31;border-radius:3px;margin-top:5px;overflow:hidden}.pb i{display:block;width:12%;height:100%;background:var(--ember)}
.gates{position:absolute;right:16px;bottom:12px;display:flex}
.g{padding:6px 11px;border:1px solid var(--line);border-left:none;background:#17191bee;cursor:pointer;min-width:98px}
.g:first-child{border-left:1px solid var(--line);border-radius:6px 0 0 6px;cursor:default}.g:last-child{border-radius:0 6px 6px 0}
.g.open{background:#232018ee}.g.open .gn{color:var(--gold)}
.g.can{border-color:#7a5a2c;border-left:1px solid #7a5a2c}.g.lock{opacity:.45;cursor:default}
.gn{font-size:10.5px;letter-spacing:.14em;color:var(--dim)}.gf{font-weight:600;font-size:13px}.gc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
aside{border-left:1px solid var(--line);background:#141617;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.box h3{margin:0 0 6px;font-size:11.5px;letter-spacing:.18em;color:var(--dim);font-weight:600}
#detail{min-height:200px}
#detail .nm{font-size:19px;font-weight:600}#detail p{margin:6px 0;color:#cfcbc2}
#detail .chg{border-left:2px solid var(--ember);padding-left:9px;color:var(--text)}
#detail .buy{margin-top:8px;font-weight:600}
#build .line{display:flex;gap:8px;padding:2px 0}#build .line span:first-child{color:var(--dim);width:82px;flex:none}
#build .style{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--gold)}
#build .cnt{font-size:22px;font-weight:700}
#log div{padding:3px 0;border-bottom:1px solid #24272b;font-size:13px}#log div:last-child{border:none}
#log b{color:var(--ember);font-weight:600}
.toast{position:fixed;left:40%;bottom:84px;transform:translateX(-50%);background:#1c1a17;border:1px solid var(--ember);border-radius:6px;padding:12px 22px;font-size:16px;box-shadow:0 8px 30px #000a;opacity:0;transition:opacity .25s;pointer-events:none;max-width:60vw;text-align:center}
.toast.show{opacity:1}.toast small{display:block;color:var(--ember);letter-spacing:.16em;font-size:11px;margin-bottom:3px}
/* 나무 */
.e{stroke:#2a2e33;stroke-width:3;fill:none}.e.on{stroke:var(--c);stroke-width:4}
.e.or{stroke:#6b5a34;stroke-dasharray:4 5;stroke-width:2}
.n{cursor:pointer}.n circle,.n rect{fill:#15171a;stroke:#34383e;stroke-width:2.5;transition:stroke .12s}
.n text{font-size:11px;fill:#666a6e;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:600}
.n.lock{cursor:default}
.n.open circle,.n.open rect{stroke:var(--c);fill:#1b1d20}.n.open text{fill:var(--text)}
.n.can circle,.n.can rect{stroke:var(--gold);fill:#2a2317;filter:drop-shadow(0 0 7px #d9b25a88)}
.n.got circle,.n.got rect{fill:var(--c);stroke:var(--c)}.n.got text{fill:#141414}
.n .ring{fill:none!important;stroke-width:1.5!important;opacity:.7;filter:none!important}
.n:hover circle:not(.ring),.n:hover rect{stroke:#fff}
.n.off{opacity:.35}
.lb{font-size:12px;fill:#b9b6ae;text-anchor:middle;pointer-events:none}
.lb.dimmed{fill:#5d6063}.lb.cost{font-size:11.5px;font-weight:600;fill:var(--gold)}.lb.poor{fill:var(--bad)}
.lb.tip{fill:var(--c);font-weight:600;letter-spacing:.04em}
.hub circle{fill:#1b1d20;stroke:var(--c);stroke-width:2.5}.hub text{fill:var(--c);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="note">
  <span><b>미리보기입니다.</b> 실제 게임이 아니라 강화 나무의 느낌을 보는 화면입니다. 재를 넣고 노드를 눌러 사 보세요. 끌어서 옮기고 휠로 확대합니다.</span>
  <button data-ash="100">재 +100</button><button data-ash="10000">재 +1만</button><button data-ash="1000000">재 +100만</button><button data-reset>처음으로</button>
</div>
<div class="wrap">
  <div class="stage">
    <svg id="svg"><g id="g"></g></svg>
    <div id="shop" hidden></div>
    <div class="hud"><div class="tabs"><button data-tab="tree" class="on">강화</button><button data-tab="shop">상점</button></div><div class="ash"><small>가진 재</small><span id="ash">0</span></div></div>
    <div class="legend"><span>◎ 큰 구매 · 하는 방식이 바뀝니다</span><span>○ 단계 강화</span></div>
    <div class="prog"><div class="pt"><b>섬의 12%</b>를 태웠습니다 <span>남은 나무 41,200그루</span></div><div class="pb"><i></i></div></div>
    <div class="gates" id="gates"></div>
  </div>
  <aside>
    <div class="box" id="detail"></div>
    <div class="box" id="build"></div>
    <div class="box"><h3>방금 산 것</h3><div id="log"></div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const COLS = {fire: ['불', '#d9643a'], tool: ['도구', '#d0a24a'], ash: ['재', '#a9b1b5'], move: ['나르기', '#7fae88']};
// 갈래가 뻗는 방향 d와 옆으로 벌어지는 방향 p. 가장 긴 재 갈래를 오른쪽으로 둔다.
const DIR = {fire: [[0, -1], [1, 0]], ash: [[1, 0], [0, 1]], tool: [[0, 1], [-1, 0]], move: [[-1, 0], [0, -1]]};
const R0 = 250, STEP = 66, LANE = 92, HUB = 140;
// at: [옆 줄, 시작 칸]. 갈림길은 두 선택지의 자리.
const ITEMS = [
  {id: 'spread', col: 'fire', kind: 'line', at: [0, 0], name: '옮겨붙기', vals: [1, 2, 4, 7, 12, 20, 30], cost: [15, 60, 300, 2000, 15000, 120000], unit: '그루', label: '불 한 번에 평균',
    desc: '나무에 불이 붙을 때 근처 나무로 옮겨붙을 확률이 오릅니다. 불은 옮겨붙을 때마다 약해져서 얼마 못 가 꺼집니다.', bigAt: {0: '이제 불이 스스로 옆 나무로 옮겨붙습니다. 성냥 하나로 여러 그루가 탑니다.'}},
  {id: 'burn', col: 'fire', kind: 'line', at: [-1, 0], name: '빨리 타기', vals: ['10초', '8초', '6.5초', '5초', '4초', '3초'], cost: [20, 150, 1200, 10000, 80000], unit: '', label: '나무가 타는 시간',
    desc: '나무가 더 빨리 타서 재가 일찍 떨어집니다. 옮겨붙는 수는 줄지 않습니다.'},
  {id: 'reach', col: 'fire', kind: 'line', at: [1, 0], name: '멀리 옮겨붙기', vals: [4.5, 7, 10, 14], cost: [80, 1200, 20000], unit: 'm', label: '건너가는 거리', desc: '불이 더 멀리 떨어진 나무로도 건너갑니다.'},
  {id: 'multi', col: 'fire', kind: 'line', at: [2, 0], name: '같이 붙이기', vals: [0, 1, 2, 3, 4], cost: [40, 400, 4000, 40000], unit: '그루', label: '함께 붙는 나무', desc: '불을 붙일 때 바로 옆 나무에도 함께 붙습니다.'},
  {id: 'ember', col: 'fire', kind: 'line', at: [-2, 0], name: '불똥', vals: [0, 5, 10, 20, 30], cost: [3000, 12000, 60000, 300000], unit: '%', label: '불똥이 튈 확률',
    desc: '타는 나무에서 불똥이 날아가 떨어진 곳의 나무에 새 불을 냅니다.', bigAt: {0: '불똥이 날아가 빈터 건너편에서 새 불이 납니다.'}},

  {id: 'save', col: 'tool', kind: 'line', at: [-2, 0], name: '아껴 쓰기', vals: ['0%', '30%', '60%', '닳지 않음'], cost: [200, 5000, 200000], unit: '', label: '쓰고도 줄지 않을 확률',
    names: ['아껴 쓰기 I', '아껴 쓰기 II', '닳지 않는 불씨'], desc: '불을 붙여도 성냥, 가스, 기름, 신호탄이 줄지 않을 때가 있습니다.', bigAt: {2: '성냥, 가스, 기름, 신호탄이 더는 줄지 않습니다.'}},
  {id: 'dline', col: 'tool', kind: 'line', at: [1, 0], name: '굵은 기름줄', vals: [2, 3, 4.5, 6, 8], cost: [1500, 10000, 80000, 500000], unit: 'm', label: '기름 불이 닿는 너비',
    desc: '드립 토치로 흘린 불이 길 양옆으로 더 넓게 닿습니다.', req: ['shop', 'drip'], reqText: '상점에서 드립 토치를 산'},
  {id: 'fline', col: 'tool', kind: 'line', at: [2, 0], name: '큰 신호탄', vals: [3, 5, 8, 12, 18], cost: [8000, 50000, 300000, 1500000], unit: 'm', label: '불이 붙는 범위',
    desc: '신호탄이 떨어진 자리에서 더 넓은 범위의 나무에 불이 붙습니다.', req: ['shop', 'flare'], reqText: '상점에서 신호탄 총을 산'},
  {id: 'hand', col: 'tool', kind: 'line', at: [-1, 0], name: '익숙한 손', vals: [100, 80, 60, 45, 30], cost: [12, 120, 1200, 12000], unit: '%', label: '불 붙이는 시간', desc: '어떤 도구로든 불을 더 빨리 붙입니다.'},
  {id: 'pocket', col: 'tool', kind: 'line', at: [0, 0], name: '넉넉한 주머니', vals: [20, 40, 80, 160, 320, 640], cost: [10, 60, 400, 2500, 15000], unit: '개', label: '들고 다니는 성냥', desc: '성냥과 가스를 더 많이 들고 다닙니다.'},

  {id: 'bag', col: 'ash', kind: 'line', at: [0, 0], name: '자루', vals: [10, 20, 40, 80, 150, 300, 600, 1200, 2500, 5000, 10000], cost: [4, 10, 25, 60, 150, 380, 950, 2400, 6000, 15000], unit: '', label: '자루에 담는 재', desc: '자루에 재를 더 많이 담습니다.'},
  {id: 'magnet', col: 'ash', kind: 'line', at: [1, 0], name: '자석', vals: [1.5, 2, 3, 4, 6, 8, 12, 17, 25, 32, 40], cost: [6, 15, 40, 100, 250, 600, 1500, 4000, 10000, 25000], unit: 'm', label: '재가 끌려오는 거리', desc: '더 먼 곳에 떨어진 재가 저절로 끌려옵니다.'},

  {id: 'pour', col: 'ash', kind: 'line', at: [-1, 0], name: '빠른 붓기', vals: ['4초', '2초', '1초', '바로'], cost: [15, 300, 6000], unit: '', label: '자루를 비우는 시간', desc: '자루를 수거함에 더 빨리 비웁니다.'},

  {id: 'move', col: 'move', kind: 'line', at: [2, 0], name: '다리 힘', vals: [100, 115, 130, 145, 160], cost: [15, 150, 1500, 15000], unit: '%', label: '걷고 달리는 빠르기', desc: '더 빨리 걷고 달립니다.'},

// 상점: 손에 쥐거나 타는 물건과 소모품. 강화 나무와 따로 산다.

  {g: '소모품', id: 'buy_match', name: '성냥 10개', cost: 3, use: 'match', n: 10, have: '성냥', u: '개', desc: '성냥 10개를 삽니다.'},
  {g: '소모품', id: 'buy_gas', name: '가스 한 통', cost: 15, use: 'gas', n: 30, have: '가스', u: '초', need: 'lighter', desc: '불꽃을 30초 낼 가스를 삽니다. 라이터와 가스 토치가 함께 씁니다.'},
  {g: '소모품', id: 'buy_oil', name: '기름 한 통', cost: 40, use: 'oil', n: 100, have: '기름', u: 'm', need: 'drip', desc: '100m를 흘릴 기름을 삽니다.'},
  {g: '소모품', id: 'buy_flare', name: '신호탄 5발', cost: 100, use: 'flare', n: 5, have: '신호탄', u: '발', need: 'flare', desc: '신호탄 5발을 삽니다.'},
];
const SBY = Object.fromEntries(SHOP.map(x => [x.id, x]));
const fresh = () => ({ash: 20, lv: {}, pick: {}, gate: 0, log: [], shop: {match: true}, match: 5, gas: 0, oil: 0, flare: 0});
const GATES = [];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const BY = Object.fromEntries(ITEMS.map(x => [x.id, x]));
let S = fresh();
let hover = null, tab = 'tree';
const fmt = n => typeof n === 'number' ? n.toLocaleString('ko-KR') : n;
const lv = id => S.lv[id] || 0;
const reqOk = it => !it.req || (it.req[0] === 'shop' ? !!S.shop[it.req[1]] : lv(it.req[0]) >= it.req[1]);
const stepName = (it, i) => it.names ? it.names[i] : it.name + ' ' + ROMAN[i];
const swapCost = it => Math.round(it.cost * 0.2);
const P = (col, lane, tier, r) => { const [d, p] = DIR[col], k = r != null ? r : R0 + tier * STEP; return [d[0] * k + p[0] * lane * LANE, d[1] * k + p[1] * lane * LANE]; };

// 노드와 가지를 한 번만 계산한다.
const NODES = [], EDGES = [], HUBS = {};
for (const c in COLS) HUBS[c] = P(c, 0, 0, HUB);
const reqPos = it => {
  if (!it.req || it.req[0] === 'shop') return HUBS[it.col];
  const q = BY[it.req[0]];
  return q.kind === 'line' ? P(q.col, q.at[0], q.at[1] + it.req[1] - 1) : P(q.col, q.at[0], q.at[1]);
};
for (const it of ITEMS) {
  if (it.kind === 'line') {
    it.cost.forEach((_, i) => {
      const xy = P(it.col, it.at[0], it.at[1] + i);
      NODES.push({it, i, xy, r: it.bigAt && it.bigAt[i] ? 25 : 16});
      EDGES.push({from: i ? P(it.col, it.at[0], it.at[1] + i - 1) : reqPos(it), to: xy, it, i});
    });
  } else if (it.kind === 'big') {
    const xy = P(it.col, it.at[0], it.at[1]);
    NODES.push({it, i: 0, xy, r: 27});
    EDGES.push({from: reqPos(it), to: xy, it, i: 0});
  } else {
    const a = P(it.col, it.at[0][0], it.at[0][1]), b = P(it.col, it.at[1][0], it.at[1][1]);
    NODES.push({it, opt: 'a', xy: a, r: 21}, {it, opt: 'b', xy: b, r: 21});
    EDGES.push({from: reqPos(it), to: a, it, opt: 'a'}, {from: reqPos(it), to: b, it, opt: 'b'}, {from: a, to: b, it, or: true});
  }
}

function nodeState(n) {
  const it = n.it;
  if (it.kind === 'fork') {
    const p = S.pick[it.id];
    if (p) return p === n.opt ? 'got' : 'off open';
    return !reqOk(it) ? 'lock' : S.ash >= it.cost ? 'can' : 'open';
  }
  const l = lv(it.id);
  if (l > n.i) return 'got';
  if (l < n.i || !reqOk(it)) return 'lock';
  return S.ash >= (it.kind === 'big' ? it.cost : it.cost[n.i]) ? 'can' : 'open';
}

function render() {
  document.getElementById('ash').textContent = fmt(Math.floor(S.ash));
  let h = '';
  for (const c in COLS) h += `<line class="e on" style="--c:${COLS[c][1]}" x1="0" y1="0" x2="${HUBS[c][0]}" y2="${HUBS[c][1]}"/>`;
  for (const e of EDGES) {
    const on = e.or ? false : e.it.kind === 'fork' ? S.pick[e.it.id] === e.opt : lv(e.it.id) > e.i;
    h += `<line class="e ${e.or ? 'or' : on ? 'on' : ''}" style="--c:${COLS[e.it.col][1]}" x1="${e.from[0]}" y1="${e.from[1]}" x2="${e.to[0]}" y2="${e.to[1]}"/>`;
  }
  h += `<circle cx="0" cy="0" r="36" fill="#e8833a" stroke="#ffd9a8" stroke-width="2"/><text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1208">불씨</text>`;
  for (const c in COLS) h += `<g class="hub" style="--c:${COLS[c][1]}"><circle cx="${HUBS[c][0]}" cy="${HUBS[c][1]}" r="25"/><text x="${HUBS[c][0]}" y="${HUBS[c][1]}">${COLS[c][0]}</text></g>`;
  for (const n of NODES) {
    const it = n.it, st = nodeState(n), [x, y] = n.xy, c = COLS[it.col][1];
    const attr = `class="n ${st}" style="--c:${c}" data-id="${it.id}"${n.opt ? ` data-opt="${n.opt}"` : ''}`;
    const dim = /lock|off/.test(st) ? 'dimmed' : '';
    if (it.kind === 'fork') {
      h += `<g ${attr}><rect x="${x - n.r}" y="${y - n.r}" width="${n.r * 2}" height="${n.r * 2}" rx="3" transform="rotate(45 ${x} ${y})"/></g>`;
      h += `<text class="lb ${dim}" x="${x}" y="${y + n.r + 22}">${it[n.opt].name}</text>`;
      if (!S.pick[it.id] && reqOk(it) && n.opt === 'a') h += `<text class="lb cost ${S.ash >= it.cost ? '' : 'poor'}" x="${(n.xy[0] + P(it.col, it.at[1][0], it.at[1][1])[0]) / 2}" y="${(n.xy[1] + P(it.col, it.at[1][0], it.at[1][1])[1]) / 2 - 30}">둘 중 하나 · ${fmt(it.cost)}</text>`;
      continue;
    }
    const big = n.r > 20;
    h += `<g ${attr}><circle cx="${x}" cy="${y}" r="${n.r}"/>${big ? `<circle class="ring" cx="${x}" cy="${y}" r="${n.r + 5}" stroke="${/got|open|can/.test(st) ? c : '#34383e'}"/>` : ''}<text x="${x}" y="${y}">${it.kind === 'line' && !big ? ROMAN[n.i] : ''}</text></g>`;
    if (big) h += `<text class="lb ${dim}" x="${x}" y="${y + n.r + 20}">${it.kind === 'big' ? it.name : stepName(it, n.i)}</text>`;
    if (/open|can/.test(st)) h += `<text class="lb cost ${st === 'can' ? '' : 'poor'}" x="${x}" y="${y - n.r - (big ? 13 : 9)}">${fmt(it.kind === 'big' ? it.cost : it.cost[n.i])}</text>`;
  }
  // 줄 이름은 줄 끝에 적는다.
  for (const it of ITEMS) if (it.kind === 'line') {
    const [x, y] = P(it.col, it.at[0], it.at[1] + it.cost.length - 1 + 0.75), d = DIR[it.col][0];
    h += `<text class="lb tip" style="--c:${COLS[it.col][1]}" x="${x}" y="${y + 4}" text-anchor="${d[0] > 0 ? 'start' : d[0] < 0 ? 'end' : 'middle'}" ${d[0] ? `dx="${-d[0] * 30}"` : ''}>${it.name} ${lv(it.id)}/${it.cost.length}</text>`;
  }
  document.getElementById('g').innerHTML = h;

  document.getElementById('gates').innerHTML = GATES.map(([nm, cost], i) => {
    const open = i <= S.gate, next = i === S.gate + 1;
    return `<div class="g ${open ? 'open' : next ? (S.ash >= cost ? 'can' : '') : 'lock'}" data-gate="${i}"><div class="gn">화력 ${i + 1}</div><div class="gf">${nm}</div><div class="gc">${open ? '갈 수 있음' : fmt(cost)}</div></div>`;
  }).join('');
  const forks = ITEMS.filter(x => x.kind === 'fork');
  let got = 0, all = 0;
  for (const n of NODES) { if (n.it.kind === 'fork') { if (n.opt === 'a') { all++; if (S.pick[n.it.id]) got++; } } else { all++; if (lv(n.it.id) > n.i) got++; } }
  let b = `<h3>내 성장</h3><div class="cnt">${got} <span style="font-size:13px;color:var(--dim);font-weight:400">/ ${all} 노드</span></div>` +
    forks.map(f => `<div class="line"><span>${f.name}</span><span>${S.pick[f.id] ? '<b>' + f[S.pick[f.id]].name + '</b>' : '<span style="color:var(--dim)">아직 안 고름</span>'}</span></div>`).join('');
  const owned = g => SHOP.filter(x => x.g === g && S.shop[x.id]).map(x => x.name).join(', ') || '없음';
  b += `<div class="line"><span>가진 도구</span><span>${owned('도구')}</span></div><div class="line"><span>탈것</span><span>${owned('탈것')}</span></div>`;
  b += `<div class="line"><span>드론</span><span><b>${BY.dcount.vals[lv('dcount')]}</b>대${lv('dbag') ? ' · 자루도 비움' : ''}</span></div>`;
  b += `<div class="line"><span>성냥 · 가스</span><span><b>${S.match}</b>개 · <b>${S.gas}</b>초</span></div>`;
  if (S.shop.drip || S.shop.flare) b += `<div class="line"><span>기름 · 신호탄</span><span><b>${S.oil}</b>m · <b>${S.flare}</b>발</span></div>`;
  document.getElementById('build').innerHTML = b;
  document.getElementById('log').innerHTML = S.log.length ? S.log.slice(0, 6).map(x => `<div>${x}</div>`).join('') : '<div style="color:var(--dim)">아직 없습니다.</div>';
  // 상점
  let sh = '';
  for (const g of ['도구', '탈것', '소모품']) {
    sh += `<h2>${g}</h2><div class="sg">` + SHOP.filter(x => x.g === g).map(x => {
      const own = !x.use && S.shop[x.id], lock = x.need && !S.shop[x.need], can = !own && !lock && S.ash >= x.cost;
      const right = own ? '가짐' : lock ? SBY[x.need].name + ' 필요' : fmt(x.cost);
      const sub = x.use ? `가진 ${x.have} <b>${S[x.use]}</b>${x.u}` : x.chg;
      return `<div class="si ${own ? 'own' : lock ? 'lock' : can ? 'can' : 'poor'}" data-shop="${x.id}"><div class="r"><span class="nm">${x.name}</span><span class="cost">${right}</span></div><div class="sub">${sub}</div></div>`;
    }).join('') + '</div>';
  }
  document.getElementById('shop').innerHTML = sh;
  document.getElementById('shop').hidden = tab !== 'shop';
  document.getElementById('svg').style.visibility = tab === 'tree' ? '' : 'hidden';
  document.querySelector('.legend').hidden = document.getElementById('gates').hidden = tab !== 'tree';
  document.querySelectorAll('[data-tab]').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  detail();
}

function detail() {
  const el = document.getElementById('detail');
  if (!hover) { el.innerHTML = '<h3>설명</h3><p style="color:var(--dim)">노드에 마우스를 올리면 설명이 나옵니다. 누르면 삽니다.</p>'; return; }
  const [id, opt, idx] = hover, it = BY[id] || SBY[id];
  let h = '';
  if (opt === 'shop') {
    const own = !it.use && S.shop[id], lock = it.need && !S.shop[it.need];
    h = `<h3>상점 · ${it.g}</h3><div class="nm">${it.name}</div><p>${it.desc}</p>${it.chg && !it.use ? `<p class="chg">${it.chg}</p>` : ''}<div class="buy">${own ? '이미 가지고 있습니다' : lock ? SBY[it.need].name + '이(가) 있어야 살 수 있습니다' : '사기 · 재 ' + fmt(it.cost)}</div>`;
  } else if (it.kind === 'fork') {
    const p = S.pick[id], o = it[opt];
    h = `<h3>갈림길 · ${it.name}</h3><div class="nm">${o.name}</div><p>${o.desc}</p><p style="color:var(--dim)">둘 중 하나만 고릅니다. 고른 뒤에도 재를 내고 다른 쪽으로 바꿀 수 있습니다.</p>`;
    h += `<div class="buy">${!reqOk(it) ? it.reqText + ' 뒤에 고를 수 있습니다' : p === opt ? '지금 고른 쪽입니다' : p ? '이쪽으로 바꾸기 · 재 ' + fmt(swapCost(it)) : '고르기 · 재 ' + fmt(it.cost)}</div>`;
  } else if (it.kind === 'big') {
    h = `<h3>큰 구매</h3><div class="nm">${it.name}</div><p>${it.desc}</p><p class="chg">${it.chg}</p><div class="buy">${lv(id) ? '이미 가지고 있습니다' : !reqOk(it) ? it.reqText + ' 뒤에 살 수 있습니다' : '사기 · 재 ' + fmt(it.cost)}</div>`;
  } else {
    const l = lv(id), i = idx, big = it.bigAt && it.bigAt[i];
    h = `<h3>${big ? '큰 구매' : '단계 강화'} · ${i + 1} / ${it.cost.length}</h3><div class="nm">${stepName(it, i)}</div><p>${it.desc}</p>`;
    if (big) h += `<p class="chg">${it.bigAt[i]}</p>`;
    h += `<p>${it.label} ${fmt(it.vals[i])}${it.unit} → <b>${fmt(it.vals[i + 1])}${it.unit}</b></p>`;
    h += `<div class="buy">${l > i ? '이미 배웠습니다' : !reqOk(it) ? it.reqText + ' 뒤에 살 수 있습니다' : l < i ? '앞 단계를 먼저 사야 합니다 · 재 ' + fmt(it.cost[i]) : '사기 · 재 ' + fmt(it.cost[i])}</div>`;
  }
  el.innerHTML = h;
}

let tt;
function toast(small, text) {
  const t = document.getElementById('toast');
  t.innerHTML = `<small>${small}</small>${text}`; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
}
function pay(c) { if (S.ash < c) { toast('재가 모자랍니다', '재 ' + fmt(c - Math.floor(S.ash)) + ' 더 필요합니다'); return false; } S.ash -= c; return true; }

// 화면 이동·확대
const svg = document.getElementById('svg');
let vb = {x: -900, y: -740, w: 1900, h: 1444}, drag = null, moved = false;
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
svg.addEventListener('pointerdown', ev => { drag = {x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y}; moved = false; });
window.addEventListener('pointermove', ev => {
  if (!drag) return;
  const k = Math.max(vb.w / svg.clientWidth, vb.h / svg.clientHeight), dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; svg.classList.add('drag'); }
  if (moved) { vb.x = drag.vx - dx * k; vb.y = drag.vy - dy * k; setVB(); }
});
window.addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const f = ev.deltaY > 0 ? 1.12 : 1 / 1.12, r = svg.getBoundingClientRect();
  const nw = Math.min(4000, Math.max(500, vb.w * f)), s = nw / vb.w;
  const px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
  vb.x += vb.w * px * (1 - s); vb.y += vb.h * py * (1 - s); vb.w = nw; vb.h *= s; setVB();
}, {passive: false});

document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-ash]'); if (a) { S.ash += +a.dataset.ash; render(); return; }
  if (ev.target.closest('[data-reset]')) { S = fresh(); render(); return; }
  const tb = ev.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; hover = null; render(); return; }
  const si = ev.target.closest('[data-shop]');
  if (si) {
    const x = SBY[si.dataset.shop];
    if ((x.need && !S.shop[x.need]) || (!x.use && S.shop[x.id]) || !pay(x.cost)) return;
    if (x.use) { S[x.use] += x.n; S.log.unshift(`${x.name} · 상점`); }
    else { S.shop[x.id] = true; S.log.unshift(`<b>${x.name}</b> · ${x.chg}`); toast('새 물건', x.chg); }
    render(); return;
  }
  const g = ev.target.closest('[data-gate]');
  if (g) {
    const i = +g.dataset.gate;
    if (i === S.gate + 1 && pay(GATES[i][1])) { S.gate = i; S.log.unshift(`<b>화력 ${i + 1}</b> · ${GATES[i][0]}에 들어갈 수 있습니다`); toast('새 숲', GATES[i][0] + '의 나무에 불을 붙일 수 있습니다'); render(); }
    return;
  }
  const el = ev.target.closest('[data-id]'); if (!el || moved) return;
  const it = BY[el.dataset.id];
  if (!reqOk(it)) return;
  if (it.kind === 'fork') {
    const k = el.dataset.opt, p = S.pick[it.id];
    if (p === k || !pay(p ? swapCost(it) : it.cost)) return;
    S.pick[it.id] = k;
    S.log.unshift(`<b>${it[k].name}</b> · ${it.name}${p ? ' (바꿈)' : ''}`);
    toast(p ? '방식을 바꿨습니다' : '방식을 골랐습니다', it[k].name + ' — ' + it[k].desc.split('. ')[0] + '.');
  } else if (it.kind === 'big') {
    if (lv(it.id) || !pay(it.cost)) return;
    S.lv[it.id] = 1; S.log.unshift(`<b>${it.name}</b> · ${it.chg}`); toast('이제 달라집니다', it.chg);
  } else {
    const l = lv(it.id); if (l >= it.cost.length || !pay(it.cost[l])) return;
    S.lv[it.id] = l + 1;
    if (it.bigAt && it.bigAt[l]) { S.log.unshift(`<b>${stepName(it, l)}</b> · ${it.bigAt[l]}`); toast('이제 달라집니다', it.bigAt[l]); }
    else S.log.unshift(`${stepName(it, l)} · ${it.label} ${fmt(it.vals[l + 1])}${it.unit}`);
  }
  render();
});
// 올린 노드의 단계 번호: 같은 줄의 노드는 그려진 순서가 곧 단계다.
document.addEventListener('mouseover', ev => {
  const s = ev.target.closest('[data-shop]');
  if (s) { if (!hover || hover[0] !== s.dataset.shop) { hover = [s.dataset.shop, 'shop', 0]; detail(); } return; }
  const el = ev.target.closest('.n'); if (!el) return;
  const id = el.dataset.id, sib = [...document.querySelectorAll(`.n[data-id="${id}"]`)];
  const h = [id, el.dataset.opt, sib.indexOf(el)];
  if (!hover || hover.join() !== h.join()) { hover = h; detail(); }
});
setVB(); render();
</script>
</body>
</html>
